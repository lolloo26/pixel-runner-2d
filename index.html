<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Runner 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay">
            <div id="main-menu" class="overlay-screen">
                <h1>PIXEL RUNNER</h1>
                <button id="start-btn">GIOCA</button>
                <button id="shop-btn">NEGOZIO</button>
                <div id="main-instructions">TOCCA O PREMI SPAZIO PER SALTARE<br>↓ / FRECCIA GIÙ PER SCIVOLARE<br>COLPISCI IL BERSAGLIO AL MOMENTO GIUSTO</div>
                <div id="main-coins" class="coin-display"></div>
                <div id="main-highscore"></div>
            </div>

            <div id="game-ui" class="hidden">
                <div id="score-container">
                    <div id="current-score">0</div>
                    <div id="coin-count"></div>
                </div>
                <div id="biome-indicator">GIUNGLA</div>
            </div>

            <div id="timing-prompt" class="hidden">TOCCA IL BERSAGLIO A TEMPO</div>

            <button id="duck-control" aria-label="Abbassati e accelera la caduta"><span>↓</span><small>SCIVOLA</small></button>

            <div id="game-over" class="overlay-screen hidden">
                <h2>GAME OVER</h2>
                <div id="final-score"></div>
                <div id="final-coins"></div>
                <div id="new-record" class="hidden">NUOVO RECORD!</div>
                <button id="restart-btn">RIPROVA</button>
                <button id="gameover-shop-btn">NEGOZIO</button>
                <button id="menu-btn">MENU</button>
            </div>

            <div id="shop-menu" class="overlay-screen hidden">
                <h2>NEGOZIO</h2>
                <div id="shop-coins" class="coin-display"></div>
                <div id="skin-selector"></div>
                <button id="buy-chest-btn">APRI BAULE (50 monete)</button>
                <button id="back-btn">INDIETRO</button>
            </div>

            <div id="chest-overlay" class="overlay-screen hidden">
                <canvas id="chest-canvas"></canvas>
                <div id="chest-result" class="hidden"></div>
                <button id="chest-close-btn" class="hidden">CONTINUA</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
